name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 09:17 KST (00:17 UTC)
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-streak-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Generate streak image
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: profile/streak.svg
          options: '{"user":"HaeinSeo","theme":"default","hide_border":true,"background":"FFF7FC","stroke":"F9D5E8","ring":"F973C9","fire":"FF69B4","currStreakNum":"831843","sideNums":"831843","currStreakLabel":"BE185D","sideLabels":"9D174D","dates":"6B7280","disable_animations":true,"timezone":"Asia/Seoul"}'

      - name: Commit updated image
        shell: bash
        run: |
          set -euo pipefail
          test -s profile/streak.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update GitHub streak stats"
          git pull --rebase
          git push
